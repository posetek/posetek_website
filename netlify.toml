[build]
  command = "npm --prefix app ci && node scripts/build-production.mjs"
  publish = "production-dist"

# Astro 7, Vite 8 and TypeScript 6 need a current Node; the site's default runtime was
# older, which failed every build since the React port with "exit code 2".
[build.environment]
  NODE_VERSION = "22"
  ASTRO_TELEMETRY_DISABLED = "1"
  # Netlify's smart secrets detection fails the build on the Firebase web API key,
  # which is a public project identifier (access is enforced by Firestore/Storage
  # rules and App Check, not by this value). Every deploy since the React port
  # failed at this step with "exit code 2" after a successful build.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyBSfyXyhmD4kYGRSg-jOmGeLeOO8hX0-Gs"

# Hashed SPA bundles are immutable; everything else stays fresh so legacy
# pages and the SPA shell update on every deploy. The /assets rule comes LAST:
# when multiple header rules match, the later rule's value wins for the same
# header key, and the generic *.js/*.css patterns also match /assets files.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/coaches"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/coaches/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Public marketing entries must precede the application fallback. Explicit
# rewrites keep clean URLs and refreshes on the coaches entry.
[[redirects]]
  from = "/coaches"
  to = "/coaches/index.html"
  status = 200

[[redirects]]
  from = "/coaches/"
  to = "/coaches/index.html"
  status = 200

# The public pages are isolated entries. Existing app routes use application.html.
[[redirects]]
  from = "/feedback"
  to = "/feedback.html"
  status = 200

[[redirects]]
  from = "/feedback/"
  to = "/feedback.html"
  status = 200

# SPA fallback: files that exist in dist/ (unported legacy pages, assets) are
# served directly; everything else — including the ported legacy URLs like
# /profile.html that are intentionally absent from dist/ — is handled by the
# React app, whose router has aliases for each ported legacy path and a real
# 404 route for everything unknown.
[[redirects]]
  from = "/*"
  to = "/application.html"
  status = 200

[[headers]]
  for = "/feedback*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://us-central1-kickai-69dd0.cloudfunctions.net https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; img-src 'self' data:; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"

[[headers]]
  for = "/marketing/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
