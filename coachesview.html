<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061b14">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 256x256"><link rel="icon" type="image/png" sizes="96x96" href="/brand/posetek-p-96.png"><link rel="icon" type="image/svg+xml" sizes="any" href="/brand/posetek-p.svg"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <title>Roster | PoseTek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <link rel="stylesheet" href="pose-portal.css?v=20260815-mobile-port">
</head>
<body class="portal-body roster-body">
  <header class="portal-header">
    <a class="portal-brand" href="coachesview.html?userType=coach" aria-label="PoseTek roster"><span class="portal-brand-mark">P</span><span>POSETEK</span></a>
    <button class="quiet-button" id="signOutButton" type="button"><span class="material-symbols-outlined">logout</span><span>Sign Out</span></button>
  </header>

  <main class="roster-shell">
    <section class="roster-heading">
      <div><p class="eyebrow" id="organizationName">Coach dashboard</p><h1>Roster</h1><p id="rosterSummary">Loading athletes…</p></div>
      <button class="icon-button" id="refreshButton" type="button" aria-label="Refresh roster"><span class="material-symbols-outlined">refresh</span></button>
    </section>

    <label class="search-field" id="searchWrap" hidden><span class="material-symbols-outlined">search</span><input id="playerSearch" type="search" placeholder="Search athletes" autocomplete="off"></label>
    <section class="roster-list" id="playersGrid" aria-live="polite"><div class="portal-loading"><span class="spinner"></span><p>Loading your roster…</p></div></section>
    <button class="primary-cta roster-add" id="addPlayerButton" type="button"><span class="material-symbols-outlined">person_add</span>Add Player</button>
  </main>

  <dialog class="portal-dialog" id="addPlayerDialog">
    <form method="dialog" class="dialog-card" id="dialogShell">
      <header><div><p class="eyebrow">Roster</p><h2>Add a player</h2></div><button class="icon-button" value="cancel" aria-label="Close"><span class="material-symbols-outlined">close</span></button></header>
      <div class="segmented-control" role="tablist"><button type="button" class="active" data-add-tab="new">New player</button><button type="button" data-add-tab="existing">Player code</button></div>
      <section data-add-panel="new">
        <label>First name<input id="newFirstName" maxlength="80" autocomplete="off"></label>
        <label>Last name<input id="newLastName" maxlength="80" autocomplete="off"></label>
        <button class="primary-cta" id="createPlayerButton" type="button">Create Player</button>
      </section>
      <section data-add-panel="existing" hidden>
        <label>Player code<input id="existingPlayerCode" maxlength="20" placeholder="PLR123" autocomplete="off"></label>
        <button class="primary-cta" id="addExistingButton" type="button">Add to Roster</button>
      </section>
      <p class="form-message" id="formMessage" aria-live="polite"></p>
    </form>
  </dialog>

  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-functions-compat.js"></script>
    <script src="firebase-identity.js?v=20260906"></script>
  <script src="coach-roster.js?v=20260906-admission"></script>
</body>
</html>
