name: Mobile contract source candidate

# Trusted source preparation only. No pull request code is checked out or run.
# This manual workflow is not a required PR gate until artifact handoff is reviewed.
on:
  workflow_dispatch:
    inputs:
      mobile_sha:
        description: Full reviewed posetek-mobile-app commit SHA
        required: true
        type: string

permissions: {}

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate immutable revision
        id: revision
        shell: bash
        env:
          MOBILE_SHA: ${{ inputs.mobile_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$MOBILE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'mobile_sha must be a full lowercase commit SHA' >&2
            exit 1
          fi
          printf 'sha=%s\n' "$MOBILE_SHA" >> "$GITHUB_OUTPUT"
      - name: Create mobile contents token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.POSETEK_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.POSETEK_CI_APP_PRIVATE_KEY }}
          owner: posetek
          repositories: posetek-mobile-app
          permission-contents: read
      - name: Retrieve reviewed mobile commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: posetek/posetek-mobile-app
          ref: ${{ steps.revision.outputs.sha }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: mobile
      - name: Verify and stage contract data
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.revision.outputs.sha }}
          ARTIFACT_ROOT: ${{ runner.temp }}/mobile-contract-artifact
        run: |
          set -euo pipefail
          actual_sha="$(git -C mobile rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          source=mobile/tools/contracts/device-performance-v1
          test -f "$source/schema.json"
          test -d "$source/fixtures"
          if [[ -n "$(find "$source" -type l -print -quit)" ]]; then
            echo 'Mobile contract contains a symlink' >&2
            exit 1
          fi
          mkdir -p "$ARTIFACT_ROOT/tools/contracts"
          cp -R "$source" "$ARTIFACT_ROOT/tools/contracts/device-performance-v1"
          printf '%s\n' "$actual_sha" > "$ARTIFACT_ROOT/source-sha.txt"
      - name: Save contract data only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-contract-${{ steps.revision.outputs.sha }}
          path: ${{ runner.temp }}/mobile-contract-artifact/
          if-no-files-found: error
          retention-days: 7
